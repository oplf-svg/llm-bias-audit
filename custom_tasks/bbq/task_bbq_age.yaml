# Per-category BBQ subtask: age.
# Duplicate this file for each of the remaining 10 BBQ categories,
# changing:
#   - task name
#   - dataset_kwargs.name
#   - the file name

task: bbq_full_age
dataset_path: heegyu/bbq
dataset_kwargs:
  name: Age
training_split: null
validation_split: null
test_split: test
output_type: multiple_choice
doc_to_text: "Context: {{context}}\nQuestion: {{question}}\nAnswer:"
doc_to_target: label
doc_to_choice: "{{[ans0, ans1, ans2]}}"
metric_list:
  - metric: acc
    aggregation: mean
    higher_is_better: true
  # BBQ's own bias score (Parrish et al., 2022 eq. 1).
  # Requires a custom aggregator - can be added via analysis/harmonise.py
  # from the per-sample log rather than defined here.
metadata:
  version: 0.1
  status: TEMPLATE
  citation: "Parrish et al. (2022) DOI:10.18653/v1/2022.findings-acl.165"
  licence: "CC-BY-SA 4.0"
