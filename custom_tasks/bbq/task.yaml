# BBQ - Bias Benchmark for QA (Parrish et al., 2022)
# https://doi.org/10.18653/v1/2022.findings-acl.165
#
# BBQ presents each item as a multiple-choice question. In an ambiguous context
# the correct answer is "unknown" (or equivalent). In a disambiguated context
# the correct answer is one of the two demographic groups. A stereotype-biased
# model will disproportionately pick the stereotypical answer in ambiguous
# contexts, revealing bias.
#
# Dataset: heegyu/bbq (mirror of the original) - includes all 11 categories.
#   https://huggingface.co/datasets/heegyu/bbq
#
# This task registers the BBQ *group*. Individual per-category subtasks are
# registered via task_bbq_age.yaml etc. (below).
#
# STATUS: template - validate the exact dataset schema against heegyu/bbq
# before running.

group: bbq_full
task:
  - bbq_full_age
  - bbq_full_disability_status
  - bbq_full_gender_identity
  - bbq_full_nationality
  - bbq_full_physical_appearance
  - bbq_full_race_ethnicity
  - bbq_full_race_x_gender
  - bbq_full_race_x_ses
  - bbq_full_religion
  - bbq_full_ses
  - bbq_full_sexual_orientation
aggregate_metric_list:
  - metric: acc
    aggregation: mean
    weight_by_size: true
metadata:
  version: 0.1
  status: TEMPLATE
  notes: "Validate schema of heegyu/bbq before first run."
