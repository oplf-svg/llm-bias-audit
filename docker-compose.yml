# docker-compose.yml - one-command local runs with the pinned CUDA image.
# Usage:
#   docker compose up pilot            # smoke test
#   docker compose up full             # full panel
#   docker compose up analyse          # stats pipeline only
#
# GPU passthrough requires the NVIDIA Container Toolkit to be installed on the host.

services:
  pilot:
    build: .
    image: llm-bias-audit:latest
    command: bash scripts/pilot.sh
    volumes:
      - .:/work
      - hf_cache:/root/.cache/huggingface
    working_dir: /work
    environment:
      - HF_HOME=/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]

  full:
    build: .
    image: llm-bias-audit:latest
    command: bash scripts/run_all.sh
    volumes:
      - .:/work
      - hf_cache:/root/.cache/huggingface
    working_dir: /work
    environment:
      - HF_HOME=/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]

  analyse:
    build: .
    image: llm-bias-audit:latest
    command: bash -c "python analysis/harmonise.py && python analysis/agreement.py && python analysis/divergence.py && python analysis/report.py"
    volumes:
      - .:/work
    working_dir: /work

volumes:
  hf_cache:
    driver: local
