# Repository-level Python tooling config.

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Only enable the rules we actually enforce; keep noise low.
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes (unused imports, unused variables, undefined names)
    "W",   # pycodestyle warnings
    "I",   # isort (import order)
]
ignore = [
    "E501",  # line-too-long (we already set line-length above)
    "E402",  # module-import-not-at-top-of-file (harmless in Colab)
]

[tool.ruff.lint.per-file-ignores]
"analysis/__init__.py" = ["F401"]
