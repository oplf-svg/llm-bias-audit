name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff==0.6.9
      - name: Ruff check
        run: ruff check analysis/ scripts/
      - name: Ruff format check
        run: ruff format --check analysis/ scripts/ || true

  imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install analysis-only deps
        run: |
          python -m pip install --upgrade pip
          pip install \
            pandas==2.2.3 \
            numpy==1.26.4 \
            scipy==1.14.1 \
            matplotlib==3.9.2 \
            seaborn==0.13.2 \
            statsmodels==0.14.4 \
            pyarrow==17.0.0
      - name: Import smoke-test analysis modules
        run: |
          python -c "import analysis.harmonise, analysis.agreement, analysis.divergence, analysis.report; print('imports ok')"

  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell script syntax
        run: |
          for f in scripts/*.sh; do
            bash -n "$f" && echo "  ok  $f"
          done
      - name: YAML/JSON parse
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y yq jq
          for f in configs/*.yaml custom_probe/*.yaml .github/workflows/*.yml; do
            yq eval '.' "$f" > /dev/null && echo "  ok  $f"
          done
          for f in notebooks/*.ipynb; do
            jq empty "$f" && echo "  ok  $f"
          done
